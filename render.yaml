services:
  # ---------------------------------------------------------
  # 1. Tailor Cards Backend API (Spring Boot Docker Service)
  # ---------------------------------------------------------
  - type: web
    name: tailorcards-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/products
    envVars:
      - key: PORT
        value: 8080
      # Required: the app refuses to boot without it. Set the value in the Render dashboard.
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: tailorcards-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tailorcards-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tailorcards-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tailorcards-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tailorcards-db
          property: password

  # ---------------------------------------------------------
  # 2. Tailor Cards Frontend (React + Vite Static Site)
  # ---------------------------------------------------------
  - type: web
    name: tailorcards-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Security headers (same as frontend/vercel.json)
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://tailor-cards-api.onrender.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

# ---------------------------------------------------------
# 3. PostgreSQL Database (Render Managed PostgreSQL)
# ---------------------------------------------------------
databases:
  - name: tailorcards-db
    databaseName: tailorcards
    user: tailorcards_user
    plan: free
    region: oregon

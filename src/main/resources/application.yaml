server:
  port: ${PORT:8080}

spring:
  application:
    name: api

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  data:
    web:
      pageable:
        default-page-size: 100
        max-page-size: 500

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tailorcards}?prepareThreshold=0}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  flyway:
    enabled: false

supabase:
  url: ${SUPABASE_URL:}
  key: ${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_KEY:${SUPABASE_ANON_KEY:}}}
  bucket: ${SUPABASE_BUCKET:buylist-images}

buylist:
  upload-base-dir: uploads
  upload-dir: uploads/buylist

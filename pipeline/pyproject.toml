[project]
name = "tailor-cards-price-pipeline"
version = "1.0.0"
description = "Daily TCGdex price pipeline for Tailor Cards (AWS Lambda)"
requires-python = ">=3.12"
# The Lambda uses only the standard library and the runtime's boto3; nothing is bundled.
dependencies = []

[dependency-groups]
dev = ["pytest==8.3.4", "moto[s3,secretsmanager]==5.0.26", "boto3==1.35.90"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

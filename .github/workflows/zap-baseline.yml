# OWASP ZAP baseline scan: starts the app (backend with PostgreSQL, and the production frontend build served with
# the same headers as Vercel), spiders it and runs ZAP's passive checks: missing or weak security headers, cookie
# flags, information leaks, reflected XSS. Rules marked FAIL in .zap/rules.tsv fail the job; others are reported.
# Reports are uploaded as artifacts. It never attacks production.
name: ZAP baseline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '41 5 * * 1' # weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline (frontend and API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tailorcards
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start the backend
        run: |
          ./mvnw -B -q -DskipTests package
          # Throwaway secrets for this run only
          ADMIN_PASSWORD="$(openssl rand -hex 24)"
          TOTP_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export ADMIN_PASSWORD TOTP_ENCRYPTION_KEY
          export DB_HOST=localhost DB_PORT=5432 DB_NAME=tailorcards DB_USERNAME=postgres DB_PASSWORD=postgres
          nohup java -jar target/api-*.jar > backend.log 2>&1 &
          for _ in $(seq 1 60); do curl -fs http://localhost:8080/api/products > /dev/null && break; sleep 2; done
          curl -fsS http://localhost:8080/api/products > /dev/null

      - name: Build and serve the frontend with the production headers
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup node scripts/serve-dist.mjs dist vercel.json 4173 > ../frontend-server.log 2>&1 &
          for _ in $(seq 1 20); do curl -fs http://localhost:4173/ > /dev/null && break; sleep 1; done

      - name: ZAP baseline, frontend
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:4173/
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -I -j
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-frontend

      - name: ZAP baseline, API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080/swagger-ui/index.html
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -I -j
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api

      - name: App logs
        if: failure()
        run: tail -n 200 backend.log frontend-server.log

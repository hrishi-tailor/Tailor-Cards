# Build, test and deploy to the AWS staging environment (infra/envs/staging). Authenticates to AWS with GitHub's
# OIDC token: no AWS keys are stored in GitHub. Only for accounts that allow OIDC providers (enable_github_oidc);
# otherwise CodeBuild runs the same deploy (buildspec-staging.yml). Turned on by the repository variable
# STAGING_DEPLOY_ENABLED=true (see infra/README.md). Production (Render/Vercel) is not affected.
name: Deploy to staging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test and package
        run: ./mvnw -B verify

      - name: Keep the jar
        uses: actions/upload-artifact@v7
        with:
          name: api-jar
          path: target/api-*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging # the OIDC token names this environment; the AWS role trusts only it
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      FRONTEND_DISTRIBUTION_ID: ${{ vars.FRONTEND_DISTRIBUTION_ID }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the jar
        uses: actions/download-artifact@v8.0.2
        with:
          name: api-jar
          path: target

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Jar to the server through SSM (health check, automatic rollback), frontend to S3 and CloudFront, smoke test
      - name: Deploy
        env:
          VERSION: ${{ github.sha }}
        run: VERSION="${VERSION::12}" bash infra/scripts/deploy-staging.sh

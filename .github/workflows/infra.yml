# Terraform checks for infra/: formatting, validation, TFLint (incl. AWS rules) and Checkov (security
# misconfigurations; accepted exceptions are listed with reasons in infra/.checkov.yaml). Never touches AWS.
name: Infrastructure

on:
  push:
    branches: [ main ]
    paths: [ 'infra/**', 'frontend/vercel.json', '.github/workflows/infra.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'infra/**', 'frontend/vercel.json', '.github/workflows/infra.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: fmt, validate, tflint, checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6

      - name: Formatting
        run: terraform fmt -check -recursive -diff infra

      - name: Validate (bootstrap, staging, prod)
        run: |
          for dir in infra/bootstrap infra/envs/staging infra/envs/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: TFLint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: infra
          framework: terraform
          config_file: infra/.checkov.yaml
          quiet: true
